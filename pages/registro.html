<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pacientes - ColombiaMedHistory</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Franja con colores de la bandera -->
    <div class="colombia-stripe"></div>

    <!-- Barra de navegacion -->
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="navbar-logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>ColombiaMed<span class="logo-accent">History</span></span>
            </a>

            <ul class="navbar-links" id="navbarLinks">
                <li><a href="../index.html" class="nav-link"><i class="fa-solid fa-house"></i> Inicio</a></li>
                <li><a href="../index.html#consultar" class="nav-link"><i class="fa-solid fa-magnifying-glass"></i> Consultar</a></li>
                <li><a href="registro.html" class="nav-link active"><i class="fa-solid fa-user-plus"></i> Registrar</a></li>
                <li><a href="../index.html#acerca" class="nav-link"><i class="fa-solid fa-circle-info"></i> Acerca de</a></li>
            </ul>

            <button class="navbar-toggle" id="navbarToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Contenido del formulario -->
    <main style="padding: 110px 20px 60px;">
        <div class="container">
            
            <div style="text-align: center; margin-bottom: 30px;">
                <span class="hero-badge">Nuevo ingreso a la red</span>
                <h2>Registrar Nuevo Paciente</h2>
                <p style="color: #64748b; font-size: 0.95rem; margin-top: 6px;">
                    Formulario para ingresar datos básicos de un ciudadano al prototipo de la nube médica.
                </p>
            </div>

            <div class="form-box">
                <form id="formRegistro">
                    <div class="form-group">
                        <label for="tipoDocumento">
                            <i class="fa-solid fa-id-card" style="color: #0284c7;"></i> Tipo de documento
                        </label>
                        <select id="tipoDocumento" required>
                            <option value="">Selecciona una opción</option>
                            <option value="CC">Cédula de Ciudadanía (CC)</option>
                            <option value="TI">Tarjeta de Identidad (TI)</option>
                            <option value="RC">Registro Civil (RC)</option>
                            <option value="CE">Cédula de Extranjería (CE)</option>
                            <option value="PPT">Permiso de Protección Temporal (PPT)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="numeroDocumento">
                            <i class="fa-solid fa-hashtag" style="color: #10b981;"></i> Número de documento
                        </label>
                        <input type="text" id="numeroDocumento" placeholder="Ej: DEMO-CC-0021" required>
                    </div>

                    <div class="form-group">
                        <label for="nombres">
                            <i class="fa-solid fa-user" style="color: #0ea5e9;"></i> Nombres completos
                        </label>
                        <input type="text" id="nombres" placeholder="Ej: Camilo Andrés" required>
                    </div>

                    <div class="form-group">
                        <label for="apellidos">
                            <i class="fa-solid fa-user" style="color: #0ea5e9;"></i> Apellidos
                        </label>
                        <input type="text" id="apellidos" placeholder="Ej: Salazar Pérez" required>
                    </div>

                    <div class="form-group">
                        <label for="fechaNacimiento">
                            <i class="fa-solid fa-calendar" style="color: #f97316;"></i> Fecha de nacimiento
                        </label>
                        <input type="date" id="fechaNacimiento" required>
                    </div>

                    <div class="form-group">
                        <label for="tipoSangre">
                            <i class="fa-solid fa-droplet" style="color: #dc2626;"></i> Tipo de sangre
                        </label>
                        <select id="tipoSangre">
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="correo">
                            <i class="fa-solid fa-envelope" style="color: #10b981;"></i> Correo electrónico
                        </label>
                        <input type="email" id="correo" placeholder="correo@ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="telefono">
                            <i class="fa-solid fa-phone" style="color: #0284c7;"></i> Teléfono de contacto
                        </label>
                        <input type="tel" id="telefono" placeholder="3001234567">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fa-solid fa-user-plus"></i> Guardar en la red médica
                    </button>
                </form>

                <div id="mensajeRegistro" style="margin-top: 20px;"></div>
            </div>

        </div>
    </main>

    <!-- Pie de pagina -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 ColombiaMedHistory - Proyecto de Competencias Digitales</p>
                <div class="footer-stripe"></div>
            </div>
        </div>
    </footer>

    <script src="../js/registro.js"></script>
</body>
</html>
